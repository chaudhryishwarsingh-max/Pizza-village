<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Village - Udaipur</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #fff8f0;
}

header {
  background: #c62828;
  color: white;
  padding: 20px;
  text-align: center;
}

.logo {
  width: 90px;
}

.menu {
  padding: 20px;
}

.item {
  background: white;
  padding: 15px;
  margin: 12px 0;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

button {
  background: #c62828;
  color: white;
  border: none;
  padding: 8px 15px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #a81d1d;
}

.cart {
  background: white;
  padding: 15px;
  box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
}

input {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<header>
<img src="https://i.imgur.com/7yUvePI.png" class="logo">
<h2>Pizza Village</h2>
<p>Fresh Dough Fresh Ingredients</p>
<p>📍 Udaipur | ⏰ 10 AM – 11 PM</p>
</header>

<div class="menu">
<h3>🍕 Our Menu</h3>

<div class="item">
<h4>Margherita Pizza - ₹199</h4>
<button onclick="addToCart('Margherita Pizza - ₹199')">Add</button>
</div>

<div class="item">
<h4>Farmhouse Pizza - ₹249</h4>
<button onclick="addToCart('Farmhouse Pizza - ₹249')">Add</button>
</div>

<div class="item">
<h4>Paneer Tikka Pizza - ₹299</h4>
<button onclick="addToCart('Paneer Tikka Pizza - ₹299')">Add</button>
</div>

</div>

<div class="cart">
<h4>🧾 Customer Details</h4>
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="address" placeholder="Delivery Address">

<button onclick="orderWhatsApp()">Order on WhatsApp</button>

<p>Minimum Order ₹250 | No Delivery Charges</p>
</div>

<script>
let cart = [];

function addToCart(item) {
  cart.push(item);
  alert(item + " added to cart");
}

function orderWhatsApp() {
  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;

  if (cart.length == 0) {
    alert("Please add items first");
    return;
  }

  let message = "Pizza Order%0A";
  message += "Name: " + name + "%0A";
  message += "Address: " + address + "%0A";
  message += "Items:%0A";

  cart.forEach(item => {
    message += "- " + item + "%0A";
  });

  window.open("https://wa.me/919376414114?text=" + message);
}
</script>

</body>
</html>
