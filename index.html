<!DOCTYPE html>
<html>
<head>
<title>Pizza Village</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #fff5f0;
  text-align: center;
}

header {
  background: #e63946;
  color: white;
  padding: 20px;
}

.logo {
  width: 90px;
}

.menu {
  padding: 20px;
}

.item {
  background: white;
  margin: 15px;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

button {
  background: #e63946;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #c1121f;
}

.cart {
  background: white;
  padding: 20px;
  margin: 20px;
  border-radius: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

input {
  width: 90%;
  padding: 8px;
  margin: 6px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<header>
<img src="https://i.imgur.com/7yUvePI.png" class="logo">
<h2>Pizza Village</h2>
<p>Fresh Dough • Fresh Ingredients</p>
<p>📍 Udaipur | ⏰ 10 AM – 11 PM</p>
</header>

<div class="menu">
<h3>🍕 Our Menu</h3>

<div class="item">
<h4>Farmhouse Pizza - ₹249</h4>
<button onclick="addToCart('Farmhouse Pizza', 249)">Add</button>
</div>

<div class="item">
<h4>Margherita Pizza - ₹199</h4>
<button onclick="addToCart('Margherita Pizza', 199)">Add</button>
</div>

</div>

<div class="cart">
<h3>🧾 Customer Details</h3>
<h4>Total Amount: ₹ <span id="total">0</span></h4>

<input type="text" id="name" placeholder="Your Name">
<input type="text" id="address" placeholder="Delivery Address">

<button onclick="orderWhatsApp()">Order on WhatsApp</button>

<p>Minimum Order ₹250 | No Delivery Charges</p>
</div>

<script>
let cart = [];
let total = 0;

function addToCart(item, price) {
  cart.push(item);
  total += price;
  document.getElementById("total").innerText = total;
  alert(item + " added to cart");
}

function orderWhatsApp() {

  if(cart.length == 0){
    alert("Please add items first");
    return;
  }

  let name = document.getElementById("name").value;
  let address = document.getElementById("address").value;

  let message = "Pizza Order%0A";
  message += "Name: " + name + "%0A";
  message += "Address: " + address + "%0A";
  message += "Items:%0A";

  cart.forEach(item => {
    message += "- " + item + "%0A";
  });

  message += "Total Amount: ₹" + total;

  window.open("https://wa.me/919137641414?text=" + message);
}
</script>

</body>
</html>
